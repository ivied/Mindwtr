<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 14px/1.6 -apple-system, system-ui, sans-serif;
        max-width: 520px;
        margin: 40px auto;
        padding: 0 20px;
        color: #1d1c1d;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 16px 0 4px;
      }
      input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 13px;
      }
      .hint {
        color: #616061;
        font-size: 12px;
        margin-top: 4px;
      }
      button {
        margin-top: 20px;
        padding: 10px 18px;
        border: 0;
        border-radius: 6px;
        background: #007a5a;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      #saved {
        color: #1b5e20;
        margin-left: 12px;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #saved.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <h1>Slack Token Bridge — settings</h1>

    <label for="endpoint">ai-service endpoint</label>
    <input id="endpoint" placeholder="https://ai.kurdy.uk/v1/slack/session" />
    <div class="hint">POST target. Must end in /v1/slack/session.</div>

    <label for="authToken">Auth token (Bearer)</label>
    <input id="authToken" type="password" placeholder="ai-service HTTP_AUTH_TOKEN" />
    <div class="hint">Same value as HTTP_AUTH_TOKEN in your ai-service .env.</div>

    <label for="intervalMin">Refresh interval (minutes)</label>
    <input id="intervalMin" type="number" min="5" value="30" />
    <div class="hint">How often to re-push tokens (handles rotation). Min 5.</div>

    <div>
      <button id="save">Save</button>
      <span id="saved">Saved ✓</span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
